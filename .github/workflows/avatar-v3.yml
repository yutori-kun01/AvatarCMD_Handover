name: Avatar v3 validation
on:
  pull_request:
    paths: ['avatar-cmd_v3/**', '.github/workflows/avatar-v3.yml']
  push:
    branches: [main, 'claude/**', 'codex/**']
    paths: ['avatar-cmd_v3/**', '.github/workflows/avatar-v3.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avatar-cmd_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:regression
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
