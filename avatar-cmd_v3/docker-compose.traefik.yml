# ============================================
# Traefik 連携用オーバーライド（VPS の既存 Traefik に接続）
# ============================================
# docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
# TRAEFIK_NETWORK / DOMAIN / TRAEFIK_CERTRESOLVER は .env で変更可能

services:
  web:
    ports: !reset []
    networks: [internal, traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-net}"
      - "traefik.http.routers.avatar-cmd.rule=Host(`${DOMAIN:?DOMAIN を .env に設定してください}`)"
      - "traefik.http.routers.avatar-cmd.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.avatar-cmd.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.avatar-cmd.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-net}
