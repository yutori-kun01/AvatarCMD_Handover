# ============================================
# Avatar CMD v3 — Docker Compose
# ============================================
# 起動:  bash scripts/setup-env.sh https://avatar-cmd.example.com   # 初回のみ .env 生成
#        docker compose up -d --build
# Traefik 経由で公開する場合（既存の Traefik ネットワークに接続）:
#        docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
# ============================================

x-app-env: &app-env
  DATABASE_URL: postgresql://avatar:${DB_PASSWORD:?DB_PASSWORD を .env に設定してください}@db:5432/avatar_cmd?schema=public
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY を .env に設定してください}
  SESSION_SECRET: ${SESSION_SECRET:-}
  APP_URL: ${APP_URL:-http://localhost:3333}
  MEDIA_DIR: /app/data/media
  GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}   # 任意: Gemini API の接続先を変える場合のみ

services:
  # ─── PostgreSQL ───
  db:
    image: postgres:16-alpine
    container_name: avatar-cmd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: avatar_cmd
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d avatar_cmd"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  # ─── DB マイグレーション（起動時に1回実行して終了） ───
  migrate:
    build: { context: ., target: worker }
    image: avatar-cmd-worker
    container_name: avatar-cmd-migrate
    environment: *app-env
    command: ["packages/db/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # ─── Web ダッシュボード ───
  web:
    build: { context: ., target: web }
    image: avatar-cmd-web
    container_name: avatar-cmd-web
    restart: unless-stopped
    environment:
      <<: *app-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD を .env に設定してください}
      GHOST_URL: ${GHOST_URL:-}
      GHOST_CONTENT_API_KEY: ${GHOST_CONTENT_API_KEY:-}
    ports:
      - "${WEB_PORT:-3333}:3000"
    volumes:
      - media:/app/data/media
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }

  # ─── Worker（予約投稿を各SNSへ送信） ───
  worker:
    image: avatar-cmd-worker
    container_name: avatar-cmd-worker
    restart: unless-stopped
    environment:
      <<: *app-env
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-15000}
      SCHEDULER_MAX_RETRIES: ${SCHEDULER_MAX_RETRIES:-3}
    volumes:
      - media:/app/data/media
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  media:
